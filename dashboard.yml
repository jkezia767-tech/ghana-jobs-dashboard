name: Refresh and publish Ghana jobs

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/dashboard.yml'
      - 'data/**'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Collect new data (takes about an hour); leave off to publish saved data only'
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * *' # 10 AM UTC = 10 AM Ghana time. GitHub can delay starts.

permissions:
  contents: read

concurrency:
  group: ghana-jobs-refresh-and-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build or refresh dashboard
        id: build
        env:
          COLLECT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$COLLECT" = "true" ]; then
            python -u cloud_run.py --collect --project-dir .
          else
            python -u cloud_run.py --project-dir .
          fi
      - name: Preserve collected data for the next run
        # Also save per-record checkpoints if a later render step fails.
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/jobs_current.csv data/job_links_current.csv
          if [ -f logs/refresh_latest.json ]; then
            git add -- logs/refresh_latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update saved Ghana job records and refresh status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag collection errors after publishing retained records
        if: ${{ steps.build.outputs.collector_code != '0' }}
        run: |
          echo '::error::One or more sources failed or the refresh was interrupted. Saved records were retained and the status report was published.'
          exit 1
